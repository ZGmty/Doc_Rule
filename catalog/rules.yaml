  - 发布说明
  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-008-统一使用正式项目主体称谓.md
  dedup_signature: 主体称谓不符合当前文体或同一主体称谓混用，导致身份与职责不清
  authoring_guard: 根据文件类型建立主体词典；项目文件采用正式项目主体，说明书采用操作人员等角色，商务函件保留合适礼貌称谓，全文保持一致。
  review_check: 全文检查客户、我司、你方、贵司、用户方等称谓并核对同一主体是否统一
  detection_hints:
  - 客户已明确
  - 如客户需要
  - 客户提供
  - 客户侧
  - 我司
