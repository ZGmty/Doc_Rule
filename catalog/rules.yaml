version: 3
language: zh-CN
repository_purpose: 面向技术方案、标书、说明书及其他正式对外文件的写作与审查规范
defaults:
  audience: 按文档类型确定接收方，包括项目参与方、操作人员和对外读者
  assumption: 除非明确为内部稿，否则按正式对外交付文件处理
  workflow:
  - 自动识别任务模式并读取高阶标准与文档类型配置
  - 加载通用规则，再按文档类型、内容和严重度筛选补充规则
  - 核对事实依据并将适用规则转换为写作前置约束
  - 完稿后验证整体结构、事实语义、全文一致性和受保护内容
  - 规则库迭代时按上游来源工作流检查更新，语义去重并按授权范围采用
rules:
- id: DR-FRM-001
  title: 禁止内部提示型版式残留
  status: active
  category: formal-delivery
  severity: high
  applies_to:
  - 技术方案
  - 标书
  - 合同技术附件
  - 实施方案
  - 验收文件
  - 合同及附件
  - 说明书
  - 操作手册
  - 正式报告
  - 对外通知
  - 商务函件
  - 产品说明
  - 发布说明
  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-001-禁止内部提示型版式残留.md
  dedup_signature: 正式对外文件暴露内部编辑、提醒、审阅或草稿状态的视觉样式
  authoring_guard: 清理面向编制者的高亮、批注和草稿提示；面向读者的安全警告、操作提示按正式样式保留，并在相关操作之前出现。
  review_check: 检查段落底纹、文本高亮、提示框、批注、修订标记和异常强调边框
  detection_hints:
  - 高亮底色
  - Callout
  - 提示框
  - 强调色块
  - 编辑备注样式
  - 修订痕迹
  source_refs:
  - humanizer-zh
- id: DR-FRM-002
  title: 禁止内部版次与非正式页眉信息
  status: active
  category: formal-delivery
  severity: high
  applies_to:
  - 技术方案
  - 标书
  - 合同技术附件
  - 正式报告
  - 合同及附件
  - 说明书
  - 操作手册
  - 对外通知
  - 商务函件
  - 产品说明
  - 发布说明
  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-002-禁止内部版次与非正式页眉信息.md
  dedup_signature: 正式交付文件暴露内部草稿迭代、非正式版次或内部文控状态
  authoring_guard: 区分内部草稿版次与正式发布版本；保留说明书适用的软硬件版本和必要修订记录，清理临时标识。
  review_check: 检查所有页眉页脚、文件信息页和修订记录中的内部版本、草稿词和内部简称
  detection_hints:
  - V0.
  - draft
  - 草稿
  - 内部版
  - 页眉内部简称
  - 内部修订记录
  source_refs:
  - humanizer-zh
- id: DR-FRM-003
  title: 禁止非正式项目简称
  status: active
  category: formal-delivery
  severity: high
  applies_to:
  - 技术方案
  - 标书
  - 合同
  - 项目建议书
  - 合同及附件
  - 说明书
  - 操作手册
  - 正式报告
  - 对外通知
  - 商务函件
  - 产品说明
  - 发布说明
  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-003-禁止非正式项目简称.md
  dedup_signature: 正式文件使用未定义的项目或技术术语简称，或同一概念称谓混用
  authoring_guard: 按文体统一项目、产品、模块和接口名称；首次定义必要简称，保留官方大小写及标识，避免同一概念多称谓混用。
  review_check: 比对封面正式项目名与正文称谓，检查未定义数字代号、内部昵称和缩写
  detection_hints:
  - 口语简称
  - 数字代号
  - 内部代称
  - 未定义缩写
  source_refs:
  - document-style-guide
  - chinese-copywriting
- id: DR-FRM-004
  title: 禁止文档自述式元话语
  status: active
  category: formal-delivery
  severity: medium
  applies_to:
  - 技术方案
  - 标书
  - 正式报告
