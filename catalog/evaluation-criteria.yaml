version: 2
name: 正式对外文件高阶质量评判标准
purpose: 在单条规则之外，帮助 Agent 对正式文档进行整体成品判断，并发现尚未被规则库覆盖的新问题
core_judgement: 读者应直接获得准确、清楚、可用于判断或行动的内容
quality_target:
- 准确
- 清楚
- 自然
- 专业
- 结构一致
- 适合文体
- 可供读者使用
criteria:
- id: Q-01
  title: 文件身份单一且明确
  question: 整份文件是否始终保持同一种正式文档身份
  positive: 封面、页眉、目录、章节和正文服务于清晰的主要文档身份
  negative_signals:
  - 多套文档身份并存
  - 技术方案与谈判材料混用
  - Proposal/Negotiation/Runbook 等标签叠加
- id: Q-02
  title: 读者任务优先
  question: 读者能否尽快找到需要的方案、操作、结论或行动信息
  positive: 按文体组织信息，必要前提和安全提示在相关操作之前
  negative_signals:
  - 方案内容被免责话术淹没
  - 说明书只有概念没有步骤
  - 通知缺少对象时间或行动
  - 安全警告晚于操作
- id: Q-03
  title: 低作者存在感
  question: 正文是否直接呈现最终方案，而不是展示作者如何写、改、组织或重构
  positive: 直接呈现有效内容，保留有用导读、方法依据和正式版本差异
  negative_signals:
  - 原方案
  - 重构版
  - 重新映射
  - 有意保留
  - 为什么这里不展开
- id: Q-04
  title: 结构原生一致
  question: 文件是否像天然形成的一套完整结构，而不是旧稿拼接和迁移结果
  positive: 信息归属清晰，术语统一，章节之间主从关系明确
  negative_signals:
  - 迁移痕迹
  - 新旧结构共存
  - 同一内容多处重复
  - 编号残留
- id: Q-05
  title: 术语自然且必要
  question: 文档术语是否来自行业、项目和甲方语境，而非为了包装而自创体系
  positive: 优先使用行业通用术语和项目既有语言
  negative_signals:
  - 概念包装过度
  - 大量自创术语
  - 不必要英文标签
  - 客户需先学习作者框架
- id: Q-06
  title: 信息唯一归属
  question: 每项关键信息是否有唯一主位置
  positive: 关键信息有主位置，摘要、索引和操作警告按用途保留必要重复
  negative_signals:
  - 完整性焦虑
  - 重复展开
  - 正文与附录重复
  - 多个章节反复描述同一场景
- id: Q-07
  title: 表达方式与内容复杂度匹配
  question: 复杂关系是否用合适的图表文字或步骤表达
  positive: 图说明关系，表组织结构化信息，文字解释逻辑，步骤支持操作
  negative_signals:
  - 复杂关系难以理解
  - 缺少必要流程或操作示意
  - 装饰图多于有效信息
- id: Q-08
  title: 视觉设计克制
  question: 视觉是否服务阅读而不是展示模板设计
  positive: 稳定、统一、克制、低干扰
  negative_signals:
  - 大量色块
  - 章节卡片过多
  - 装饰性英文
  - 口号化页面
  - PPT/咨询报告感
- id: Q-09
  title: 如实区分已确认内容与待确认事项
  question: 是否明确区分事实目标计划待确认输入和可选项
  positive: 当前状态清楚，已确认内容有依据，关键缺口如实说明
  negative_signals:
  - 将计划写成完成
  - 将未知写成确定
  - 内部探索过程原样交付
  - 缺少明确基线
- id: Q-10
  title: 事实、语义与全文口径准确
  question: 关键主张是否有依据，改写和跨章节引用是否保持准确
  positive: 事实可核验，限定与归因完整，数字和单位一致
  negative_signals:
  - 无依据功能
  - 虚构背书
  - 改写增减承诺
  - 数字口径冲突
- id: Q-11
  title: 表达自然且有实际信息
  question: 句子是否清楚表达实际内容并符合文体
  positive: 直接陈述，指代明确，保留有效对比与必要限定
  negative_signals:
  - 空对比
  - 无对象辩护
  - 重复铺垫和拔高
  - 抽象名词堆叠
- id: Q-12
  title: 操作可执行，结果可判断
  question: 操作内容是否有必要条件步骤与结果依据，技术文本是否完整
  positive: 条件可检查、位置可定位、结果可判断，代码和引用有效
  negative_signals:
  - 编造按钮或参数
  - 缺少结果判断
  - 警告晚于操作
  - 命令或链接损坏
holistic_questions:
- 如果去掉公司名称，这份文件是否仍然像通用 AI/咨询模板批量生成的
- 客户是否需要先理解作者设计的框架，才能理解项目本身
- 文件是否在解释我们怎么写方案，而不是直接给方案
- 客户是否会明显感知旧稿、草稿、重构、迁移或内部讨论痕迹
- 规避责任是否比解决问题更突出
- 是否为了显得完整而重复堆叠内容
- 复杂关系是否缺少帮助理解的图表或步骤
- 整份文件是否仍有未处理的内部编制痕迹
- 是否存在无依据主张、语义改变或全文口径冲突
- 目标读者是否缺少完成操作或判断所需的信息
agent_order:
- 先识别文体与读者任务，进行高阶判断
- 核验事实依据并检查适用规则
- 验证改写语义、全文口径和受保护内容
- 识别尚未覆盖的问题；维护时刷新来源、语义去重并按授权采用
