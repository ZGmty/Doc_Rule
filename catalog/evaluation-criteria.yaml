version: 1
name: "正式客户文件高阶质量评判标准"
purpose: "在单条规则之外，帮助 Agent 对正式文档进行整体成品判断，并发现尚未被规则库覆盖的新问题"

core_judgement: "客户应看到方案本身，而不是作者的写作过程、包装过程、重构过程、风险控制过程或自我证明过程"
quality_target: ["成熟", "克制", "自然", "专业", "一次成型", "原生一致", "工程化", "可直接对外交付"]

criteria:
  - id: Q-01
    title: "文件身份单一且明确"
    question: "整份文件是否始终保持同一种正式文档身份"
    positive: "封面、页眉、目录、章节和正文语态共同服务于唯一主身份"
    negative_signals: ["多套文档身份并存", "技术方案与谈判材料混用", "Proposal/Negotiation/Runbook 等标签叠加"]

  - id: Q-02
    title: "解决方案优先"
    question: "客户是否先看到怎么解决问题，而不是先看到限制、免责和风险控制"
    positive: "项目目标、总体方案、场景实现、实施、验收、交付构成主叙事"
    negative_signals: ["边界章节过早", "大量前置假设", "不纳入项喧宾夺主", "供应商风险控制成为第一主线"]

  - id: Q-03
    title: "低作者存在感"
    question: "正文是否直接呈现最终方案，而不是展示作者如何写、改、组织或重构"
    positive: "读者只感知项目和方案"
    negative_signals: ["原方案", "重构版", "重新映射", "有意保留", "为什么这里不展开"]

  - id: Q-04
    title: "结构原生一致"
    question: "文件是否像天然形成的一套完整结构，而不是旧稿拼接和迁移结果"
    positive: "信息归属清晰，术语统一，章节之间主从关系明确"
    negative_signals: ["迁移痕迹", "新旧结构共存", "同一内容多处重复", "编号残留"]

  - id: Q-05
    title: "术语自然且必要"
    question: "文档术语是否来自行业、项目和甲方语境，而非为了包装而自创体系"
    positive: "优先使用行业通用术语和项目既有语言"
    negative_signals: ["概念包装过度", "大量自创术语", "不必要英文标签", "客户需先学习作者框架"]

  - id: Q-06
    title: "信息唯一归属"
    question: "每项关键信息是否有唯一主位置"
    positive: "正文主讲、其他章节引用或摘要"
    negative_signals: ["完整性焦虑", "重复展开", "正文与附录重复", "多个章节反复描述同一场景"]

  - id: Q-07
    title: "工程表达与复杂度匹配"
    question: "复杂工程关系是否用合适的图、表、文字表达"
    positive: "图说明关系，表说明结构，文字说明逻辑"
    negative_signals: ["复杂方案纯文字化", "无必要架构图/流程图", "装饰图多于工程图", "视觉包装过度"]

  - id: Q-08
    title: "视觉设计克制"
    question: "视觉是否服务阅读而不是展示模板设计"
    positive: "稳定、统一、克制、低干扰"
    negative_signals: ["大量色块", "章节卡片过多", "装饰性英文", "口号化页面", "PPT/咨询报告感"]

  - id: Q-09
    title: "呈现确定的当前状态"
    question: "正式文件是否给出明确基线，并清晰区分待确认项和可选项"
    positive: "已定基线、待确认输入、可选项三者边界明确"
    negative_signals: ["内部候选路线全部保留", "讨论稿语气", "大量暂定和后续再看", "缺少正式推荐基线"]

holistic_questions:
  - "如果去掉公司名称，这份文件是否仍然像通用 AI/咨询模板批量生成的"
  - "客户是否需要先理解作者设计的框架，才能理解项目本身"
  - "文件是否在解释我们怎么写方案，而不是直接给方案"
  - "客户是否会明显感知旧稿、草稿、重构、迁移或内部讨论痕迹"
  - "规避责任是否比解决问题更突出"
  - "是否为了显得完整而重复堆叠内容"
  - "工程复杂度是否得到合适的图、表、文字表达"
  - "整份文件是否像一次性正式发布的成品"

agent_order:
  - "先进行高阶成品判断"
  - "再检查已有规则"
  - "再识别规则库未覆盖的问题"
  - "需要沉淀时执行语义去重后更新规则库"
