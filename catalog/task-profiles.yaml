version: 2
task_modes:
  AUTHOR:
    description: 编写、起草、改写或完善正式文档
    triggers:
    - 编写
    - 起草
    - 生成
    - 改写
    - 完善
    - 写一份
    - 形成技术方案
    - 形成标书
    - 形成合同
    - 写说明书
    - 编写操作手册
    - 起草对外通知
    - 起草商务函件
    - 编写产品说明
    - 编写发布说明
    workflow: workflows/author-document.md
    default_actions:
    - 读取高阶标准及 catalog/document-profiles.yaml，确定文体与读者任务
    - 读取 catalog/rules.yaml，加载 active 通用规则及类型规则，按实际内容补选
    - 核对关键事实的来源、版本、条件和资料缺口
    - 将 authoring_guard 转换为前置写作约束后起草或改写
    - 完稿检查整体结构、语义保真、全文口径、操作可用性及受保护内容
    - 按 review_check 修正，关键词命中仅作线索；交付成品并说明影响交付的待确认项
  REVIEW:
    description: 检查、审查、比较或评估现有文档
    triggers:
    - 检查
    - 审查
    - 找问题
    - 评估
    - 比较版本
    - 是否正式
    - 规范性
    workflow: workflows/review-document.md
    default_actions:
    - 读取高阶标准及 catalog/document-profiles.yaml，按读者任务做整体判断
    - 读取 catalog/rules.yaml，加载 active 通用及类型规则并按内容补选
    - 核验事实依据、语义保真、全文口径、操作可用性及受保护内容；关键词命中仅作线索
    - 给出位置、证据、规则编号、问题说明和建议修改，区分确定错误与需要确认事项
  LEARN:
    description: 从真实反馈中沉淀或扩展规则库
    triggers:
    - 记录
    - 沉淀
    - 加入仓库
    - 形成规则
    - 更新规则库
    - 以后不要再出现
    - 根据反例优化
    workflow: workflows/ingest-feedback.md
    default_actions:
    - 读取 catalog/upstream-sources.yaml，按 workflows/refresh-upstream-sources.md 检查上游更新，同一任务复用结果
    - 提取候选问题
    - 去标识化
    - 读取 catalog/rules.yaml 做语义去重
    - 按 DUPLICATE / EXTENSION / NEW / CONFLICT 分类
    - 仅在授权范围内对 EXTENSION 或 NEW 修改仓库
    - 上游候选按授权采用；已批准内容直接实施，新增范围先列出提案
  MAINTAIN:
    description: 维护仓库结构、分类、规则生命周期或 Agent 可用性
    triggers:
    - 重构
    - 合并规则
    - 弃用规则
    - 优化仓库
    - 调整分类
    - 修改索引
    - 更新上游参考
    - 检查参考项目
    - 从上游提取规则
    workflow: AGENTS.md
    default_actions:
    - 读取 catalog/upstream-sources.yaml，按 workflows/refresh-upstream-sources.md 检查上游更新，同一任务复用结果
    - 保持规则 ID 稳定
    - 同步 catalog、schema、README 与 workflow
    - 避免直接删除已发布规则语义
    - 上游候选按授权采用；已批准内容直接实施，新增范围先列出提案
    - 保持文档类型配置、来源引用和规则索引一致
fallback:
  assumption: 若用户未明确说明，正式文档相关任务默认采用更严格的正式对外交付标准
  precedence:
  - 明确用户指令
  - 甲方/招标/合同/法规强制要求
  - AGENTS.md
  - catalog/task-profiles.yaml
  - 具体规则文件
mode_selection: 按用户请求的动作选择模式，文档类型不单独触发 AUTHOR；例如审查说明书进入 REVIEW。明确维护请求优先路由 LEARN 或 MAINTAIN。
