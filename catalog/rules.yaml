  - 产品说明
  - 发布说明
  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-004-禁止文档自述式元话语.md
  dedup_signature: 正文描述作者如何介绍文件，而不是直接陈述项目事实、方案或要求
  authoring_guard: 直接写有效内容，压缩预告下文、复述标题、重复收尾和聊天包装；保留有用导读、目的字段与实质总结。
  review_check: 搜索文档自述式开头并判断是否可改为直接陈述事实
  detection_hints:
  - 本方案用于
  - 本文介绍
  - 本文件旨在
  - 下面将
  - 本章节主要说明
  - 随着……发展
  - 首句复述标题
  - 综上所述
  - 希望对您有帮助
  - 机械排比
  source_refs:
  - humanizer
  - humanizer-zh
