  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-005-禁止内部素材来源与编制过程说明.md
  dedup_signature: 正式图表或正文暴露素材如何获得、草图如何整理、内部资料如何拼接等制作过程
  authoring_guard: 清理内部素材拼接和编制过程描述；保留可核验的引用、来源、版本和必要技术属性，不用删除来源掩盖资料缺口。
  review_check: 检查图注、表注和小字说明中的资料来源、素材、记忆整理、内部截图等编制痕迹
  detection_hints:
  - 资料来源
  - 项目既有素材
  - 依据记忆整理
  - 内部资料
  - 素材截图
  - 编制说明
  source_refs:
  - humanizer-zh
- id: DR-FRM-006
  title: 对外表格使用规范数字序号
  status: active
  category: formal-delivery
  severity: medium
  applies_to:
  - 技术方案
  - 标书
  - 合同附件
  - 验收文件
  - 包含对外事项清单的正式文件
  file: rules/formal-delivery/DR-FRM-006-对外表格使用规范数字序号.md
  dedup_signature: 对外表格直接暴露供应商内部任务、问题单、工作包或追踪编码
  authoring_guard: 面向甲方的事项清单默认使用阿拉伯数字序号；内部追踪编码保留在内部台账，正式外部编号除外
  review_check: 检查表格首列和清单编号，区分内部自创编码与甲方/合同/标准正式编号
  detection_hints:
  - 字母-数字内部编码
  - Q-01
  - TASK-
  - ISSUE-
  - 内部工作包编号
- id: DR-FRM-007
  title: 责任边界采用正向职责表达
  status: active
  category: formal-delivery
  severity: high
  applies_to:
  - 技术方案
  - 标书
  - 合同技术附件
  - 实施方案
  - 合同及附件
  - 说明书
  - 操作手册
  - 正式报告
  - 对外通知
  - 商务函件
  - 产品说明
  - 发布说明
  - 其他正式对外文件
  file: rules/formal-delivery/DR-FRM-007-责任边界采用正向职责表达.md
  dedup_signature: 技术边界主要通过防御性否定、排除或免责措辞表达，而非通过职责分工和能力范围表达
  authoring_guard: 用已有依据写清职责和范围；改写后保留所有必要限制，不补造功能或责任主体；安全提示随操作出现，范围排除在适当位置准确表达。
  review_check: 结合上下文检查反复免责和否定式边界；逐项对照改写前后的职责、功能、条件和完成状态，禁止仅按否定词密度判错。
  detection_hints:
  - 不负责
  - 不包含
  - 不纳入
  - 仅用于
  - 仅作为
  - 不作为
  - 不能等同于
  source_refs:
  - humanizer-zh
- id: DR-FRM-008
  title: 统一使用正式项目主体称谓
  status: active
