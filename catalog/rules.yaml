- id: DR-ACC-001
  title: 关键事实有据可查
  status: active
  category: accuracy
  severity: high
  applies_to: &id001
  - 技术方案
  - 标书
  - 合同及附件
  - 说明书
  - 操作手册
  - 正式报告
  - 对外通知
  - 商务函件
  - 产品说明
  - 发布说明
  - 其他正式对外文件
  file: rules/accuracy/DR-ACC-001-关键事实有据可查.md
  dedup_signature: 将资料缺口、推测或无依据背书写成确定事实、功能或承诺
  authoring_guard: 起草前核对关键事实的来源、版本与适用范围；资料不足时只写有依据的内容，将必要待补信息交给编制者确认。
  review_check: 抽取关键主张并与来源逐项对应，核对出处是否真正支持该内容；对冲突、缺失和过期依据列出具体待确认项，不用猜测值替代。
  detection_hints:
  - 专家认为
  - 业内领先
  - 数据显示
  - 性能承诺
  - 缺少来源
  - 版本不适用
  source_refs:
  - humanizer-zh
  - humanizer
- id: DR-ACC-002
  title: 改写保持事实与语义一致
  status: active
  category: accuracy
  severity: high
  applies_to: *id001
  file: rules/accuracy/DR-ACC-002-改写保持事实与语义一致.md
  dedup_signature: 为了简洁、自然或正向语气而增删独立信息或改变原文的条件、范围与确定程度
  authoring_guard: 改写前识别主体、动作、对象、数量、条件、否定、时间、归因和完成状态，改写后逐项对照；精简不改变事实和承诺。
  review_check: 对照输入和成稿检查新增、丢失、强化或弱化的主张，尤其核对可能、仅、超过、计划、正在、已完成和职责分配；每项变更均需有依据。
  detection_hints:
  - 计划变为完成
  - 可能变为保证
  - 超过变为等于
  - 删去仅或否定
  - 改写补造主语
  source_refs:
  - humanizer-zh
- id: DR-ACC-003
  title: 数字口径与全文信息一致
  status: active
  category: accuracy
  severity: high
  applies_to: *id001
  file: rules/accuracy/DR-ACC-003-数字口径与全文信息一致.md
  dedup_signature: 相同事项在正文图表摘要中口径冲突，或数量单位与变化关系表达错误
  authoring_guard: 建立关键数值和名称的统一依据，区分实测、额定、目标和验收值；复用时保留单位、条件、时间与比较基准。
  review_check: 提取关键参数、单位、时间和适用条件，对照全文各处及原始依据；复算增减、合计与比例，对不同口径分别标明而非强行统一。
  detection_hints:
  - 增加了
  - 降低到
  - 百分比
  - 百分点
  - 图文不一致
  - 参数冲突
  source_refs:
  - document-style-guide
  - vale
- id: DR-LNG-001
  title: 直接陈述并保留有效对比
  status: active
  category: language
  severity: medium
  applies_to: *id001
  file: rules/language/DR-LNG-001-直接陈述并保留有效对比.md
  dedup_signature: 通过没有独立信息的否定对比或假想反对意见为常规内容制造强调
  authoring_guard: 先写有用的判断、功能或要求；仅在纠正真实误解、表达必要限制或比较实际选项时使用对比与否定。
  review_check: 定位否定对比、预先辩护与跨句转折，说明每个分句的实际信息；仅删去无信息的铺垫，并按 DR-ACC-002 核对含义。
  detection_hints:
  - 不是……而是
  - 并非
  - 这并不意味着
  - 不要误会
  - 虽然……但
  - 不仅……更
  source_refs:
  - humanizer
  - humanizer-zh
  - stop-slop
- id: DR-LNG-002
  title: 用具体内容表达功能与价值
  status: active
  category: language
  severity: medium
  applies_to: *id001
  file: rules/language/DR-LNG-002-用具体内容表达功能与价值.md
  dedup_signature: 以空泛赞美、意义拔高或抽象口号代替具体功能、机制和有依据的结果
  authoring_guard: 围绕对象、动作、机制和已有结果组织文字；评价与效果结论需要适用依据，缺少数据时不通过补造指标来显得具体。
  review_check: 逐句标出实际功能、机制或证据，检查评价是否超出依据；对没有新增信息的赞美、排比和收尾进行压缩。
  detection_hints:
  - 全面赋能
  - 充分彰显
  - 坚实保障
  - 意义重大
  - 显著提升
  - 标志着新时代
  source_refs:
  - humanizer-zh
  - humanizer
  - proselint
- id: DR-LNG-003
  title: 句子动作与指代清楚
  status: active
  category: language
  severity: medium
  applies_to: *id001
  file: rules/language/DR-LNG-003-句子动作与指代清楚.md
  dedup_signature: 长定语、含混指代和抽象名词堆叠掩盖主体动作及条件关系
  authoring_guard: 优先写清已知主体、动作和对象；按理解需要拆分句子，保持修饰关系、前置条件、顺序和文体。
  review_check: 复核长定语、代词指向、抽象名词和进行表达；试读后检查拆合句是否改变主体、时态、条件与逻辑关系。
  detection_hints:
  - 相关工作
  - 进行……的开展
  - 层叠的字
  - 其
  - 该
  - 多层定语
  source_refs:
  - document-style-guide
  - humanizer-zh
  - write-good
- id: DR-MAN-001
  title: 操作步骤可执行且结果可判断
  status: active
  category: manuals
  severity: high
  applies_to:
  - 说明书
  - 操作手册
  - 安装指南
  - 维护指南
  - 实施方案
  - 验收文件
  - 故障排查
  - 含操作步骤的正式文件
  file: rules/manuals/DR-MAN-001-操作步骤可执行且结果可判断.md
  dedup_signature: 操作内容缺少执行所需条件位置顺序或结果依据，导致读者无法完成或判断操作
  authoring_guard: 按实际任务写明适用版本、必要前置条件、操作位置、步骤及结果判断；从真实资料确认界面、参数和提示，把安全提醒放在对应操作之前。
  review_check: 以目标读者视角逐步核对条件、操作位置、输入和结果，检查顺序与安全提示位置；与版本资料比对，不实际执行有副作用的操作来代替审阅。
  detection_hints:
  - 完成相关配置
  - 按要求操作
  - 即可使用
  - 缺少预期结果
  - 警告在操作之后
  source_refs:
  - document-style-guide
  - humanizer-zh
- id: DR-TYP-001
  title: 中文格式一致并保护技术文本
  status: active
  category: typography
  severity: medium
  applies_to: *id001
  file: rules/typography/DR-TYP-001-中文格式一致并保护技术文本.md
  dedup_signature: 格式混用降低可读性或全局排版替换破坏命令型号链接等受保护内容
  authoring_guard: 按正式模板和适用规范统一中文标点、数字单位、英文名称及标题层级；正文润色前识别代码、命令、路径、链接、字段、型号和原文引文。
  review_check: 按文档区域检查排版一致性，并对受保护内容作改前改后比较；检查标题变更后的锚点、目录、编号和链接目标。
  detection_hints:
  - 全半角混用
  - 专有名词大小写
  - 单位间距
  - 命令标点被替换
  - 锚点失效
  source_refs:
  - chinese-copywriting
  - vale
  - humanizer-zh
document_profiles: catalog/document-profiles.yaml
